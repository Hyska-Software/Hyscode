[package]
name = "hyscode-tui"
version = "0.1.0"
edition = "2021"
description = "Rust terminal client for the shared HysCode agent runtime"

[dependencies]
anyhow = "1"
crossterm = "0.28"
portable-pty = "0.8"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
crossterm_winapi = "0.9"
winapi = { version = "0.3", features = ["winuser"] }
