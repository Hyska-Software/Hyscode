name: "Build & Release"

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
#
# push → main (auto-build / pre-release)
#   Version = <root package.json version>-build.<run_number>
#   e.g. root package.json "0.1.3-preview" → tag v0.1.3-preview-build.42
#   Pre-release is inferred: any version with a pre-release identifier → prerelease=true
#
# workflow_dispatch (manual / stable release)
#   Developer supplies the target version (e.g. 1.0.0 or 1.0.0-beta.1).
#   CI bumps the runtime files and lock metadata, commits back with [skip ci],
#   then builds. The root package version remains the clean build base.
#
# In both cases the CI commits the bumped versions back to main so that
# `git pull` always gives the developer the exact version that was shipped.
#
# ── Build job checkout ───────────────────────────────────────────────────────
# Build jobs always check out the SHA produced by the version-bump commit
# (outputs.bumped_sha), not the original trigger SHA.  This guarantees that
# tauri.conf.json / Cargo.toml contain the correct version when the binary is
# compiled.
#
# ── IDE Update System ────────────────────────────────────────────────────────
# apps/desktop/src-tauri/src/commands/updater.rs reads app.package_info().version
# (from tauri.conf.json) as the installed version — not CARGO_PKG_VERSION.
#   Stable channel    → GET /repos/Hyska-Software/Hyscode/releases/latest
#   Pre-release ch.   → GET /repos/Hyska-Software/Hyscode/releases?per_page=20
#                        (picks the highest semver with a compatible platform asset)
#
# Asset selection by extension:
#   Desktop updater → desktop .exe/.msi/.deb/.AppImage assets only
#   VORTEX updater  → vortex-cli-* archives/installers described by the
#                     vortex-cli-manifest-<version>.json integrity manifest
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "New version (e.g. 1.2.3 or 1.2.3-beta.1)"
        required: true
        type: string
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - stable
          - pre-release
        default: stable

env:
  TAURI_SIGNING_PRIVATE_KEY: ""
  # vite build / tsc can exceed Node's default heap (~2GB) on CI runners
  # (observed OOM on macOS arm64). Raise it for all build jobs.
  NODE_OPTIONS: "--max-old-space-size=8192"

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Bump versions, create tag + draft release
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      tag_name:   ${{ steps.get-version.outputs.tag }}
      version:    ${{ steps.get-version.outputs.version }}
      prerelease: ${{ steps.get-version.outputs.prerelease }}
      # SHA of the version-bump commit (or the original HEAD if nothing changed).
      # Build jobs check out this SHA so they always compile the bumped version.
      bumped_sha: ${{ steps.version-bump.outputs.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          # GH_PAT lets the Actions bot push commits back to main without
          # triggering the "same-token push ignores [skip ci]" quirk on some plans.
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 1. Resolve the version to ship ──────────────────────────────────────
      - name: Get version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then
              echo "::error::Version input is required for manual dispatch"
              exit 1
            fi
            if [ "${{ github.event.inputs.release_type }}" = "pre-release" ]; then
              IS_PRERELEASE=true
            else
              IS_PRERELEASE=false
            fi
          else
            # Push trigger: base version lives in root package.json; append build number.
            BASE=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
            VERSION="${BASE}-build.${{ github.run_number }}"
            if echo "$BASE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-.+'; then
              IS_PRERELEASE=true
            else
              IS_PRERELEASE=false
            fi
          fi
          echo "version=$VERSION"          >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"             >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Releasing: $VERSION  |  pre-release: $IS_PRERELEASE"

      # ── 2. Write the version into every source file ──────────────────────────
      # Always runs for both push and workflow_dispatch triggers.
      # For workflow_dispatch the root package.json is also updated so the next
      # push auto-build inherits the new base version.
      - name: Bump version in source files
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            pwsh -NoProfile -NonInteractive -File scripts/bump-version.ps1 -Version "$VERSION" -Force
          else
            # Push releases derive their build version from the clean root base;
            # keep package.json and its root lock metadata unchanged.
            pwsh -NoProfile -NonInteractive -File scripts/bump-version.ps1 -Version "$VERSION" -SkipRoot -Force
          fi

      # ── 3. Commit & push the version bump back to main ───────────────────────
      # [skip ci] prevents this commit from triggering a recursive run.
      # The step always outputs the current HEAD SHA (bumped or not) so build
      # jobs can check out the exact tree that was versioned.
      - name: Commit and push version bump
        id: version-bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json \
                  apps/desktop/src-tauri/Cargo.lock \
                  apps/desktop/src-tauri/tauri.conf.json \
                  apps/desktop/src-tauri/Cargo.toml \
                  apps/desktop/package.json
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git add package.json
          fi
          if git diff --cached --quiet; then
            echo "Nothing to commit — versions already at ${{ steps.get-version.outputs.version }}"
          else
            git commit -m "chore: bump version to ${{ steps.get-version.outputs.version }} [skip ci]"
            git push origin HEAD:main
            echo "✓ Version bump committed and pushed"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ── 4. Create the git tag (points at the version-bump commit) ───────────
      - name: Create git tag
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const tag = "${{ steps.get-version.outputs.tag }}"
            const sha = "${{ steps.version-bump.outputs.sha }}"
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                ref:   `refs/tags/${tag}`,
                sha:   sha,
              })
              console.log(`✓ Tag ${tag} created at ${sha.slice(0, 7)}`)
            } catch (e) {
              if (e.status === 422) {
                console.log(`Tag ${tag} already exists — continuing`)
              } else {
                throw e
              }
            }

      # ── 5. Generate changelog from commits ───────────────────────────────────
      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            echo "Last tag: $LAST_TAG"
            CHANGELOG=$(git log "$LAST_TAG"..HEAD --pretty=format:'- %s (%h) — %an, %ad' --date=short)
          else
            echo "No previous tag found"
            CHANGELOG=$(git log --pretty=format:'- %s (%h) — %an, %ad' --date=short -20)
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="_No new commits since last release._"
          fi
          # Write to file to preserve newlines safely
          echo "$CHANGELOG" > /tmp/changelog.txt
          echo "Generated changelog:"
          cat /tmp/changelog.txt

      # ── 6. Create draft release ──────────────────────────────────────────────
      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs')
            const version    = "${{ steps.get-version.outputs.version }}"
            const tag        = "${{ steps.get-version.outputs.tag }}"
            const prerelease = "${{ steps.get-version.outputs.prerelease }}" === "true"
            const changelog  = fs.readFileSync('/tmp/changelog.txt', 'utf8')
            const body = [
              `## HysCode ${tag}`,
              ``,
              `### Downloads`,
              ``,
              `| Platform | File | Notes |`,
              `|----------|------|-------|`,
              `| Windows  | \`HysCode-Setup-*.exe\` | Desktop installer; the wizard can also install VORTEX CLI |`,
              `| Windows  | \`Vortex-CLI-Setup-*-x64.exe\` / \`vortex-cli-*-windows-x64.zip\` | Standalone VORTEX CLI (x64) |`,
              `| Linux    | \`hyscode_*.AppImage\` / \`hyscode_*.rpm\` | Desktop application |`,
              `| Linux    | \`hyscode_*.deb\` | Desktop application for Debian/Ubuntu |`,
              `| Linux    | \`HysCode-Setup-*-with-vortex-cli.deb\` | Desktop installer with an optional debconf CLI choice |`,
              `| Linux    | \`vortex-cli-*-linux-x64.deb\` / \`vortex-cli-*-linux-x64.tar.gz\` | Standalone VORTEX CLI (x64) |`,
              `| macOS    | Tauri \`.dmg\` / \`.app.tar.gz\` | Desktop application |`,
              `| macOS    | \`HysCode-Setup-*-with-vortex-cli.pkg\` | Desktop installer with an optional VORTEX CLI choice |`,
              `| macOS    | \`Vortex-CLI-Setup-*-macos-x64.pkg\` / \`vortex-cli-*-macos-x64.tar.gz\` | Standalone VORTEX CLI (x64; desktop arm64 remains available) |`,
              `| All      | \`vortex-cli-manifest-*.json\` | SHA-256 manifest used by VORTEX self-update |`,
              ``,
              prerelease
                ? `> ⚠️ **Pre-release** — available via the _Pre-release_ update channel in HysCode Settings → General → Updates.`
                : `> ✅ **Stable** — delivered automatically to users on the _Stable_ update channel.`,
              ``,
              `### Changelog`,
              changelog,
            ].join('\n')

            let releaseData
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                tag:   tag,
              })
              console.log(`Release for ${tag} already exists (id=${existing.data.id}) — reusing it`)
              releaseData = existing.data
            } catch (e) {
              if (e.status !== 404) throw e
              const created = await github.rest.repos.createRelease({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                tag_name:   tag,
                name:       `HysCode ${tag}`,
                body:       body,
                draft:      true,
                prerelease: prerelease,
              })
              console.log(`✓ Draft release created: ${created.data.html_url}`)
              releaseData = created.data
            }
            return releaseData.id

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — Build Windows x64
# ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.bumped_sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: "apps/desktop/src-tauri -> target"
          cache-on-failure: "true"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Prepare node-pty native assets
        run: npm rebuild node-pty --foreground-scripts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build AI sidecars (Windows x64)
        run: npm run build:sidecars

      - name: Build Tauri (Windows x64 — binary only)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target x86_64-pc-windows-msvc --no-bundle

      - name: Copy sidecars next to release binary
        shell: pwsh
        run: |
          node scripts/copy-sidecars.mjs --target "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release"
          Get-ChildItem "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release" -Name | Select-String "codex|claude"

      - name: Build and stage VORTEX CLI bundle
        shell: pwsh
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          npm run build:vortex -- --skip-sidecar-build --version $env:VERSION
          $cliBundle = (Resolve-Path "tools/hyscode-tui/dist/vortex-production").Path
          $cliVersion = & (Join-Path $cliBundle "vortex.exe") --version
          if ($LASTEXITCODE -ne 0 -or $cliVersion -notmatch [regex]::Escape("vortex $env:VERSION")) { throw "VORTEX version smoke test failed: $cliVersion" }
          $desktopReleaseDir = (Resolve-Path "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release").Path
          $desktopCliDir = Join-Path $desktopReleaseDir "vortex-cli"
          if (Test-Path $desktopCliDir) { Remove-Item -LiteralPath $desktopCliDir -Recurse -Force }
          New-Item -ItemType Directory -Path $desktopCliDir -Force | Out-Null
          Copy-Item -Path (Join-Path $cliBundle "*") -Destination $desktopCliDir -Recurse -Force
          $cliArtifacts = Join-Path $env:GITHUB_WORKSPACE "artifacts\vortex-cli"
          New-Item -ItemType Directory -Path $cliArtifacts -Force | Out-Null
          node scripts/package-vortex-cli.mjs --bundle $cliBundle --output-dir $cliArtifacts --version $env:VERSION --platform win32 --arch x64

      - name: Build Inno Setup desktop installer
        shell: pwsh
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          $innoOutDir = "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/inno"
          & $iscc "/DMyAppVersion=$env:VERSION" "/FHysCode-Setup-$env:VERSION-x64" "/O$innoOutDir" "apps/desktop/src-tauri/installer/windows/hyscode.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out = Join-Path $innoOutDir "HysCode-Setup-$env:VERSION-x64.exe"
          if (-not (Test-Path $out)) { $out = Get-ChildItem $innoOutDir -Filter "*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1 -ExpandProperty FullName }
          if (-not $out -or -not (Test-Path $out)) { throw "Inno desktop installer not found in $innoOutDir" }
          "INNO_INSTALLER=$out" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build standalone VORTEX CLI installer
        shell: pwsh
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $cliOutDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\vortex-cli"
          New-Item -ItemType Directory -Path $cliOutDir -Force | Out-Null
          & $iscc "/DMyAppVersion=$env:VERSION" "/FVortex-CLI-Setup-$env:VERSION-x64" "/O$cliOutDir" "scripts/installer/vortex-cli.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $installer = Join-Path $cliOutDir "Vortex-CLI-Setup-$env:VERSION-x64.exe"
          if (-not (Test-Path $installer)) { $installer = Get-ChildItem $cliOutDir -Filter "Vortex-CLI-Setup-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1 -ExpandProperty FullName }
          if (-not $installer -or -not (Test-Path $installer)) { throw "Standalone VORTEX installer not found in $cliOutDir" }
          $archive = Join-Path $cliOutDir "vortex-cli-$env:VERSION-windows-x64.zip"
          if (-not (Test-Path $archive)) { throw "Standalone VORTEX archive not found: $archive" }
          "VORTEX_CLI_INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VORTEX_CLI_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows assets to release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag_name }}
        run: gh release upload $env:TAG "$env:INNO_INSTALLER" "$env:VORTEX_CLI_INSTALLER" "$env:VORTEX_CLI_ARCHIVE" --clobber

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — Build Linux x64
# ─────────────────────────────────────────────────────────────────────────────
  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.bumped_sha }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            binutils

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Prepare node-pty native assets
        run: npm rebuild node-pty --foreground-scripts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Prepare AppImage tooling for Bun sidecars
        run: |
          sudo tee /usr/local/bin/ldd >/dev/null <<'EOF'
          #!/bin/sh
          REAL_LDD=/usr/bin/ldd
          "$REAL_LDD" "$@"
          rc=$?
          if [ "$rc" -ne 0 ] && [ -n "$1" ] && [ -f "$1" ]; then
            if readelf -S "$1" 2>/dev/null | grep -q '\.bun'; then exit 0; fi
          fi
          exit "$rc"
          EOF
          sudo chmod +x /usr/local/bin/ldd
          mkdir -p "$HOME/.cache/tauri"
          curl -fsSL https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -o "$HOME/.cache/tauri/linuxdeploy-x86_64.AppImage"
          chmod +x "$HOME/.cache/tauri/linuxdeploy-x86_64.AppImage"

      - name: Build Tauri (Linux x64)
        shell: bash
        working-directory: apps/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: |
          failed=1
          for attempt in 1 2 3; do
            echo "::group::tauri build (attempt $attempt/3)"
            if npm run tauri build -- --bundles deb,rpm,appimage -v; then
              failed=0
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            echo "::warning::tauri build attempt $attempt/3 failed; retrying in 30s..."
            sleep 30
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::tauri build failed after 3 attempts"
            exit 1
          fi

      - name: Build and package VORTEX CLI
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          npm run build:vortex -- --skip-sidecar-build --version "$VERSION"
          CLI_VERSION=$(tools/hyscode-tui/dist/vortex-production/vortex --version)
          if [ "$CLI_VERSION" != "vortex $VERSION" ]; then
            echo "::error::VORTEX version smoke test failed: $CLI_VERSION"
            exit 1
          fi
          mkdir -p artifacts/vortex-cli
          node scripts/package-vortex-cli.mjs \
            --bundle tools/hyscode-tui/dist/vortex-production \
            --output-dir artifacts/vortex-cli \
            --version "$VERSION" \
            --platform linux \
            --arch x64
          node scripts/package-vortex-deb.mjs \
            --mode standalone \
            --bundle tools/hyscode-tui/dist/vortex-production \
            --output-dir artifacts/vortex-cli \
            --version "$VERSION" \
            --arch x64
          DESKTOP_DEB=$(find apps/desktop/src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)
          if [ -z "$DESKTOP_DEB" ]; then
            echo "::error::Desktop Debian package was not produced"
            exit 1
          fi
          node scripts/package-vortex-deb.mjs \
            --mode desktop-with-cli \
            --bundle tools/hyscode-tui/dist/vortex-production \
            --desktop-deb "$DESKTOP_DEB" \
            --output-dir artifacts/vortex-cli \
            --version "$VERSION" \
            --arch x64

      - name: Upload Linux assets to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag_name }}
        run: |
          gh release upload "$TAG" \
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb \
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm \
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage \
            artifacts/vortex-cli/*.deb \
            artifacts/vortex-cli/*.tar.gz \
            --clobber

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4 — Build macOS desktop x64/arm64 and VORTEX x64
# ─────────────────────────────────────────────────────────────────────────────
  build-macos:
    needs: create-release
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x64
          - runner: macos-14
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the version-bump commit, not the original trigger SHA.
          ref: ${{ needs.create-release.outputs.bumped_sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Prepare node-pty native assets
        if: matrix.architecture == 'x64'
        run: npm rebuild node-pty --foreground-scripts

      - name: Build Tauri (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}

# ─────────────────────────────────────────────────────────────────────────────
# Additional macOS VORTEX assets (part of build-macos)
# ─────────────────────────────────────────────────────────────────────────────
      - name: Build and package VORTEX CLI
        if: matrix.architecture == 'x64'
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          APP_PATH=$(find apps/desktop/src-tauri/target -type d -name 'HysCode.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::HysCode.app was not produced"
            exit 1
          fi
          npm run build:vortex -- --skip-sidecar-build --version "$VERSION"
          CLI_VERSION=$(tools/hyscode-tui/dist/vortex-production/vortex --version)
          if [ "$CLI_VERSION" != "vortex $VERSION" ]; then
            echo "::error::VORTEX version smoke test failed: $CLI_VERSION"
            exit 1
          fi
          mkdir -p artifacts/vortex-cli artifacts/vortex-macos
          node scripts/package-vortex-cli.mjs \
            --bundle tools/hyscode-tui/dist/vortex-production \
            --output-dir artifacts/vortex-cli \
            --version "$VERSION" \
            --platform darwin \
            --arch "$ARCHITECTURE"
          node scripts/package-vortex-macos.mjs \
            --bundle tools/hyscode-tui/dist/vortex-production \
            --app "$APP_PATH" \
            --output-dir artifacts/vortex-macos \
            --version "$VERSION" \
            --arch "$ARCHITECTURE"

      - name: Upload macOS VORTEX assets to release
        if: matrix.architecture == 'x64'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag_name }}
        run: |
          gh release upload "$TAG" \
            artifacts/vortex-cli/*.tar.gz \
            artifacts/vortex-macos/*.pkg \
            --clobber

# ─────────────────────────────────────────────────────────────────────────────
# JOB 5 — Publish release (after all platform builds succeed)
# ─────────────────────────────────────────────────────────────────────────────
  publish-release:
    needs: [create-release, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.bumped_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate and publish VORTEX update manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag_name }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          node scripts/generate-vortex-update-manifest.mjs \
            --tag "$TAG" \
            --version "$VERSION" \
            --targets x64 \
            --output "$RUNNER_TEMP/vortex-cli-manifest-$VERSION.json"
          gh release upload "$TAG" "$RUNNER_TEMP/vortex-cli-manifest-$VERSION.json" --clobber

      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            const releaseId  = ${{ needs.create-release.outputs.release_id }}
            const prerelease = "${{ needs.create-release.outputs.prerelease }}" === "true"
            const label = prerelease ? "Pre-release" : "Stable release"
            try {
              const { data } = await github.rest.repos.updateRelease({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                release_id: releaseId,
                draft:      false,
                prerelease: prerelease,
              })
              console.log(`✓ ${label} published: ${data.html_url}`)
            } catch (e) {
              if (e.status === 422 && JSON.stringify(e.response?.data?.errors ?? []).includes('already_exists')) {
                console.log(`Release already published — skipping (${e.message})`)
              } else {
                throw e
              }
            }
